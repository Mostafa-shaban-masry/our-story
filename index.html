<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080a16">
  <title>Our Story — A Cinematic Memory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      font-family: "Cairo", "Amiri", serif;
      background: #080a16;
      color: #fff;
      font-synthesis: none;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      overflow: hidden;
      background: #080a16;
    }

    button { font: inherit; }

    .player {
      position: relative;
      display: grid;
      min-height: 100svh;
      place-items: center;
      overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(ellipse at 50% 48%, rgba(47, 43, 91, .42), transparent 62%),
        #080a16;
    }

    .video-frame {
      position: absolute;
      z-index: -2;
      inset: -2%;
      overflow: hidden;
      background: #080a16;
    }

    .video-frame video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.02);
    }

    .shade {
      position: absolute;
      z-index: -1;
      inset: 0;
      background: linear-gradient(180deg, rgba(5, 7, 18, .3), rgba(5, 7, 18, .5) 48%, rgba(5, 7, 18, .83));
      transition: background 1.25s ease;
    }

    .grain {
      position: absolute;
      z-index: 0;
      inset: 0;
      pointer-events: none;
      opacity: .12;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.25'/%3E%3C/svg%3E");
      mix-blend-mode: soft-light;
    }

    .vignette {
      position: absolute;
      z-index: 0;
      inset: 0;
      pointer-events: none;
      box-shadow: inset 0 0 17vw 4vw rgba(1, 2, 12, .55);
    }

    .story {
      position: relative;
      z-index: 1;
      width: min(900px, calc(100% - 40px));
      padding: 0 0 7vh;
      text-align: center;
    }

    .welcome {
      position: absolute;
      z-index: 2;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center;
      background: radial-gradient(ellipse at center, rgba(9, 10, 27, .18), rgba(5, 6, 17, .42));
      opacity: 1;
      visibility: visible;
      transition: opacity .9s ease, visibility .9s ease;
    }

    .welcome-content {
      width: min(720px, 100%);
      transform: translateY(0);
      transition: transform .9s ease;
    }

    .welcome-kicker {
      margin: 0 0 18px;
      color: #f1ddb1;
      font-size: .78rem;
      font-weight: 600;
      letter-spacing: .24em;
    }

    .welcome-title {
      margin: 0;
      color: #fffaf0;
      font-size: clamp(2rem, 6vw, 4rem);
      font-weight: 500;
      line-height: 1.6;
      text-shadow: 0 3px 26px rgba(0, 0, 0, .75);
    }

    .welcome-copy {
      margin: 10px 0 30px;
      color: rgba(255, 250, 240, .82);
      font-size: clamp(1rem, 2.6vw, 1.3rem);
      line-height: 1.9;
    }

    .start-button {
      min-height: 54px;
      padding: 10px 30px;
      border: 1px solid rgba(241, 221, 177, .78);
      border-radius: 999px;
      color: #171324;
      background: #f1ddb1;
      box-shadow: 0 8px 34px rgba(241, 221, 177, .2);
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform .2s ease, background .2s ease, box-shadow .2s ease;
    }

    .start-button:hover {
      transform: translateY(-2px);
      background: #fff0c9;
      box-shadow: 0 12px 40px rgba(241, 221, 177, .3);
    }

    .start-button:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 4px;
    }

    .play-error {
      margin: 18px 0 0;
      color: #ffd4d4;
      font-size: .9rem;
    }

    .player.has-started .welcome {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .player.has-started .welcome-content {
      transform: translateY(12px);
    }

    .eyebrow {
      margin: 0 0 22px;
      color: rgba(241, 221, 177, .9);
      font-size: .74rem;
      font-weight: 600;
      letter-spacing: .32em;
      text-transform: uppercase;
      opacity: .82;
    }

    .subtitle {
      min-height: 5em;
      margin: 0 auto;
      color: #fffaf0;
      font-size: clamp(1.25rem, 3.5vw, 2.45rem);
      font-weight: 500;
      line-height: 1.9;
      text-shadow: 0 2px 24px rgba(0, 0, 0, .8);
      opacity: 0;
      transform: translateY(12px);
      transition: opacity .8s ease, transform .8s ease;
    }

    .subtitle.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .controls {
      position: absolute;
      z-index: 3;
      right: 0;
      bottom: max(24px, env(safe-area-inset-bottom));
      left: 0;
      display: flex;
      align-items: center;
      gap: 16px;
      width: max-content;
      margin: auto;
      padding: 14px 18px;
      border: 1px solid rgba(255, 255, 255, .13);
      border-radius: 999px;
      background: rgba(8, 9, 22, .58);
      box-shadow: 0 12px 40px rgba(0, 0, 0, .22);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      opacity: 0;
      visibility: hidden;
      transform: translateY(10px);
      transition: opacity .4s ease, transform .4s ease, visibility .4s ease;
    }

    .player.has-started .controls {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .control-button {
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      padding: 0;
      border: 1px solid rgba(255, 255, 255, .2);
      border-radius: 50%;
      color: #fff;
      background: rgba(255, 255, 255, .08);
      cursor: pointer;
      transition: background .2s ease, border-color .2s ease, transform .2s ease;
    }

    .control-button:hover {
      transform: scale(1.06);
      border-color: rgba(241, 221, 177, .7);
      background: rgba(241, 221, 177, .16);
    }

    .control-button:focus-visible {
      outline: 2px solid #f1ddb1;
      outline-offset: 3px;
    }

    .control-button svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .status {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 520px) {
      .story { padding-bottom: 12vh; }
      .eyebrow { margin-bottom: 14px; font-size: .63rem; }
      .subtitle { min-height: 4.7em; line-height: 1.8; }
      .controls {
        bottom: max(18px, env(safe-area-inset-bottom));
        gap: 10px;
        padding: 10px 12px;
      }
      .control-button { width: 38px; height: 38px; }
      .welcome-kicker { font-size: .66rem; }
      .welcome-copy { margin-bottom: 24px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="player" id="player">
    <div class="video-frame" id="videoFrame">
      <video id="storyVideo" playsinline preload="metadata" aria-label="فيديو القصة">
        <source src="https://github.com/Mostafa-shaban-masry/our-story/releases/download/v1.0.0/1023%20%281%29.mp4" type="video/mp4">
        عذراً، متصفحك لا يدعم تشغيل الفيديو.
      </video>
    </div>
    <div class="shade" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>

    <section class="welcome" id="welcome" aria-labelledby="welcomeTitle">
      <div class="welcome-content">
        <button class="start-button" id="startButton" type="button">ابدئي الحكاية</button>
        <p class="play-error" id="playError" role="alert" hidden></p>
      </div>
    </section>

    <section class="story" aria-live="polite" aria-atomic="true">
      <p class="eyebrow">A story written in the stars</p>
      <p class="subtitle" id="subtitle"></p>
    </section>

    <div class="controls" aria-label="عناصر التحكم بالفيديو">
      <button class="control-button" id="playButton" type="button" aria-label="تشغيل الفيديو" title="تشغيل">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="control-button" id="muteButton" type="button" aria-label="إلغاء كتم الصوت" title="إلغاء كتم الصوت">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3zm13.5 3a3.5 3.5 0 0 0-2-3.16v6.31a3.5 3.5 0 0 0 2-3.15zM14.5 3.23v2.06a7 7 0 0 1 0 13.42v2.06a9 9 0 0 0 0-17.54z"/></svg>
      </button>
    </div>
    <p class="status" id="status" role="status"></p>
  </main>

  <script>
    (() => {
      const video = document.getElementById("storyVideo");
      const player = document.getElementById("player");
      const subtitle = document.getElementById("subtitle");
      const startButton = document.getElementById("startButton");
      const playError = document.getElementById("playError");
      const playButton = document.getElementById("playButton");
      const muteButton = document.getElementById("muteButton");
      const status = document.getElementById("status");

      const scenes = [ 
         { start: 20, end: 24, text: "تعالي اخدك لفه في عالمي وحياتي.", mood: "clear" },
        { start: 27, end: 30, text: "أولى ثانوي..  أوضة درس، و12 كرسي مش مترتبين.", mood: "clear" },
        { start: 30, end: 34, text: "ماكنتش مركز في المكان.. لحد ما شفت مريم.", mood: "blur" },
        { start : 37, end: 41, text: "سبحان الله كان ليها اطلاله غريبه كده بتشد الواحد وكانت روحها حلوه", mood: "blur" },
       { start :45, end: 49, text: "من يومها وانا بقيت بلاقي نفسي مستني حصه من اسبوع للاسبوع.", mood: "blur" },
        { start: 51, end: 55, text: ".روحها جميله دي مكانتش ظهره في بدايه بس انا كنت ملاحظها حتي في طريقه مرحها", mood: "blur" },
        { start: 57, end: 61, text: ".كنت بتلكك عشان اتكلم في حصه علي اي حاجه بقي", mood: "blur" },
        { start: 64, end: 68, text: ".هوب الزمن لف وفعلا كلمتها وبقينا صحاب", mood: "blur" },
        { start: 70, end: 74, text: "مكانش بساهل اكسب ثقتها بجد", mood: "blur" },
        { start: 76, end: 80, text: "موضوع كان ذي الحلم", mood: "blur" },
        { start: 82, end: 86, text: "من يومها بقيت بحس اني مش لوحدي في الدنيا", mood: "blur" },
        { start: 88, end: 92, text: "مريم بقيت جزء من حياتي.. ساعدتني كتير سمعتني اكتر صلحت فيا اكتر", mood: "blur" },
        { start: 94, end: 98, text: "في يوم من الايام.. حصل موقف بينا", mood: "blur" },
        { start: 100, end: 104, text: "الموقف ده خلاني اتكلم معاها بصراحه عن كل حاجه", mood: "blur" },
        { start: 106, end: 110, text: "الموقف ده خلاني اتاكد فعلا اني بحبها", mood: "blur" },
        { start: 112, end: 116, text: "وحاولت اقولها ....وقولتلها ", mood: "blur" },
        { start :118, end :120 , text :".من يومها وموضوع بقي موترني بقيت بحسب الخطوه", mood : "blur"},
        { start: 122, end: 124, text: "فابدات فعلا اضغط بس حرفيا ده كان خوف", mood: "blur" },
        { start: 124, end: 130, text: "وعملت انا غلطات عيال بس اكبر غلطه اني مراعتيش ظروفها ولا قدرتها وحتي حاجه وحيده اللي ربطانا وهي وسيله تواصلنا شيلتها", mood: "blue" },
        { start: 130, end: 132, text: "في الاخر انا كنت بحبها", mood: "blue" },
        { start: 132, end: 134, text: "شالتني من حياتها ...بلكتني ؟؟؟؟", mood: "blur" },
        { start: 135, end: 145, text: "في النهاية.. طلبتِ إن التواصل يقف،....بس كلنا بنغلط مش كده ؟.", mood: "blur" },
        { start: 163, end: Infinity, text: "عموما ان قدر ومتكلمناش تاني انت كنتي احلي تجربه انا عشتها في حياتي.", mood: "clear" }
      ];

      let activeScene = null;
      let started = false;

      function sceneAt(time) {
        return scenes.find(scene => time >= scene.start && time < scene.end) || null;
      }

      function renderTimeline() {
        const time = video.currentTime;
        const nextScene = sceneAt(time);

        if (started && nextScene !== activeScene) {
          subtitle.classList.remove("is-visible");
          activeScene = nextScene;
          window.setTimeout(() => {
            if (activeScene === nextScene) {
              subtitle.textContent = nextScene ? nextScene.text : "";
              if (nextScene) subtitle.classList.add("is-visible");
            }
          }, 220);
        }


      }

      function updatePlayControl() {
        const isPlaying = !video.paused && !video.ended;
        playButton.setAttribute("aria-label", isPlaying ? "إيقاف الفيديو مؤقتاً" : "تشغيل الفيديو");
        playButton.title = isPlaying ? "إيقاف مؤقت" : "تشغيل";
        playButton.innerHTML = isPlaying
          ? '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>'
          : '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';
        status.textContent = isPlaying ? "الفيديو يعمل" : "الفيديو متوقف مؤقتاً";
      }

      function updateMuteControl() {
        const isMuted = video.muted;
        muteButton.setAttribute("aria-label", isMuted ? "إلغاء كتم الصوت" : "كتم الصوت");
        muteButton.title = isMuted ? "إلغاء كتم الصوت" : "كتم الصوت";
        muteButton.innerHTML = isMuted
          ? '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3zm13.59 3 2.12 2.12-1.42 1.42L15.17 13.4l-2.12 2.12-1.42-1.42 2.12-2.12-2.12-2.12 1.42-1.42 2.12 2.12 2.12-2.12 1.42 1.42L16.59 12z"/></svg>'
          : '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3zm13.5 3a3.5 3.5 0 0 0-2-3.16v6.31a3.5 3.5 0 0 0 2-3.15zM14.5 3.23v2.06a7 7 0 0 1 0 13.42v2.06a9 9 0 0 0 0-17.54z"/></svg>';
      }

      function startVideo() {
        playError.hidden = true;
        video.play().then(() => {
          started = true;
          player.classList.add("has-started");
          renderTimeline();
        }).catch(error => {
          playError.textContent = "تعذر تشغيل الفيديو. تأكدي من وجود ملف الفيديو بجوار الصفحة.";
          playError.hidden = false;
          status.textContent = playError.textContent;
          console.error("Video playback failed:", error);
        });
      }

      startButton.addEventListener("click", startVideo);

      playButton.addEventListener("click", () => {
        if (video.paused || video.ended) {
          if (video.ended) {
            video.currentTime = 0;
            activeScene = null;
          }
          video.play().catch(error => {
            status.textContent = "تعذر استئناف تشغيل الفيديو.";
            console.error("Video playback failed:", error);
          });
        } else {
          video.pause();
        }
      });

      muteButton.addEventListener("click", () => {
        video.muted = !video.muted;
        updateMuteControl();
      });

      video.addEventListener("loadedmetadata", renderTimeline);
      video.addEventListener("timeupdate", renderTimeline);
      video.addEventListener("seeked", renderTimeline);
      video.addEventListener("play", updatePlayControl);
      video.addEventListener("pause", updatePlayControl);
      video.addEventListener("ended", updatePlayControl);
      video.addEventListener("volumechange", updateMuteControl);
      video.addEventListener("error", () => {
        playError.textContent = "تعذر تحميل الفيديو. تأكدي من وجود 1023 (1).mp4 بجوار الصفحة.";
        playError.hidden = false;
        status.textContent = playError.textContent;
      });

      updatePlayControl();
      updateMuteControl();
      renderTimeline();
    })();
  </script>
</body>
</html>
